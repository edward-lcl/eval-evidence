<title id="figure-title">EVERY FIELD SAYS HOW IT IS KNOWN</title>
<desc id="figure-desc">Four vertically arranged source groups each point to exact status pills. Found in a retained artifact maps to observed. Computed from named inputs maps to derived. Stated by someone maps to operator asserted and provider asserted. Not established maps to unavailable. A footer says status and source travel with the field.</desc>
