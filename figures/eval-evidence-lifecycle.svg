<text x="80" y="92" fill="#F8FAFC" font-family="Arial, sans-serif" font-size="48" font-weight="700">A score should never travel alone.</text>
<text x="80" y="136" fill="#A7B0C0" font-family="Arial, sans-serif" font-size="24">Eval Evidence preserves the record needed to review a reported evaluation result.</text>
<text x="80" y="190" fill="#A7B0C0" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="2">POST-RUN, OFFLINE EVIDENCE LIFECYCLE</text>
