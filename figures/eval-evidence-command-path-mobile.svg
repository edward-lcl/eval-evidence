<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1000" viewBox="0 0 900 1000" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">REPORT NOW OR SAVE A BASELINE?</title>
<desc id="figure-desc">Two parallel command paths answer one decision. Report now runs check on a run and produces a current report without a saved baseline. Recheck later runs bundle to create evidence.json, then verify with run root to compare current referenced bytes with saved fingerprints and report match or mismatch.</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M0 0 L0 10 L10 5 Z" fill="#CBD5E1"/></marker></defs>
<rect width="900" height="1000" fill="#090E16"/>
<text x="50" y="54" text-anchor="start" fill="#F8FAFC" font-family="Arial" font-size="31" font-weight="800">REPORT NOW OR SAVE A BASELINE?</text>
<text x="50" y="104" text-anchor="start" fill="#A7B0C0" font-family="Arial" font-size="21" font-weight="500">check reports now without saving a baseline; bundle plus</text>
<text x="50" y="132" text-anchor="start" fill="#A7B0C0" font-family="Arial" font-size="21" font-weight="500">verify --run-root saves and later rechecks referenced</text>
<text x="50" y="160" text-anchor="start" fill="#A7B0C0" font-family="Arial" font-size="21" font-weight="500">bytes.</text>
<rect x="50" y="212" width="800" height="300" rx="22" fill="#111827" stroke="#39D0C3" stroke-width="3"/>
<text x="80" y="260" text-anchor="start" fill="#39D0C3" font-family="Arial" font-size="28" font-weight="800">REPORT NOW</text>
<text x="80" y="296" text-anchor="start" fill="#A7B0C0" font-family="Arial" font-size="21" font-weight="500">Need a report on this run now?</text>
<rect x="80" y="337" width="740" height="66" rx="15" fill="#0B1220" stroke="#39D0C3" stroke-width="3"/>
<text x="450" y="379" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="22" font-weight="700">check RUN</text>
<path d="M450 407 V420" stroke="#CBD5E1" stroke-width="4" marker-end="url(#arrow)"/>
<text x="80" y="459" text-anchor="start" fill="#39D0C3" font-family="Arial" font-size="20" font-weight="800">NO BASELINE WRITTEN</text>
<text x="820" y="459" text-anchor="end" fill="#39D0C3" font-family="Arial" font-size="21" font-weight="800">SCOPED REPORT</text>
<rect x="50" y="546" width="800" height="390" rx="22" fill="#111827" stroke="#F7D73A" stroke-width="3"/>
<text x="80" y="594" text-anchor="start" fill="#F7D73A" font-family="Arial" font-size="28" font-weight="800">RECHECK LATER</text>
<text x="80" y="630" text-anchor="start" fill="#A7B0C0" font-family="Arial" font-size="21" font-weight="500">Need to detect later byte changes?</text>
<rect x="80" y="671" width="740" height="66" rx="15" fill="#0B1220" stroke="#F7D73A" stroke-width="3"/>
<text x="450" y="713" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="22" font-weight="700">bundle RUN -o evidence.json</text>
<path d="M450 741 V754" stroke="#CBD5E1" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="80" y="759" width="740" height="66" rx="15" fill="#0B1220" stroke="#F7D73A" stroke-width="3"/>
<text x="450" y="801" text-anchor="middle" fill="#F8FAFC" font-family="monospace" font-size="22" font-weight="700">verify evidence.json --run-root RUN</text>
<path d="M450 829 V842" stroke="#CBD5E1" stroke-width="4" marker-end="url(#arrow)"/>
<text x="80" y="883" text-anchor="start" fill="#F7D73A" font-family="Arial" font-size="20" font-weight="800">SAVED BASELINE REQUIRED</text>
<text x="820" y="883" text-anchor="end" fill="#F7D73A" font-family="Arial" font-size="21" font-weight="800">MATCH / MISMATCH</text>
