<title id="figure-title">THREE RUN FILES BECOME ONE REVIEWABLE RECORD</title>
<desc id="figure-desc">On the left, result.json, config.json, and agent/trajectory.json appear as retained run files. An arrow sends them through a Read and Label adapter. On the right, one evidence.json envelope opens into three compartments: what happened, how it ran, and what can be rechecked. A footer states that unavailable evidence stays visible and is never invented.</desc>
