<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A CHANGED FILE BREAKS THE SAVED PROMISE</title>
<desc id="figure-desc">A three-act horizontal timeline begins with Save the Baseline: result.json with reward one is connected to a saved SHA-256 fingerprint inside evidence.json. In act two the file changes to reward zero and receives a different current fingerprint. In act three verify --run-root compares expected and actual fingerprints, shows a not-equal sign, and reports the exact result.json digest mismatch. A footer says to store the bundle separately and explains that detection is not attribution or truth.</desc>
<rect width="900" height="1600" fill="#090E16"/>
<text x="52" y="55" fill="#F8FAFC" font-family="Arial" font-size="32" font-weight="800" text-anchor="start">A CHANGED FILE BREAKS THE SAVED</text>
<text x="52" y="94" fill="#F8FAFC" font-family="Arial" font-size="32" font-weight="800" text-anchor="start">PROMISE</text>
<text x="52" y="132" fill="#A9B4C5" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">The saved bundle remembers each referenced file&#x27;s byte</text>
<text x="52" y="161" fill="#A9B4C5" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">identity, so a later edit becomes a named mismatch instead of</text>
<rect x="52" y="195" width="796" height="270" rx="24" fill="#111827" stroke="#39D0C3" stroke-width="3"/>
<text x="82" y="248" fill="#39D0C3" font-family="Arial" font-size="31" font-weight="800" text-anchor="start">1  SAVE THE BASELINE</text>
