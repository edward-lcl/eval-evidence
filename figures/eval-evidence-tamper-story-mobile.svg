<desc id="figure-desc">A compact three-step line reads Save, Change, Verify. Save records result.json with reward one and digest 8d14 through a6c2. Change shows reward zero and digest f913 through 7b40. Verify compares expected and actual fingerprints, displays a not-equal sign, and reports the named result.json mismatch with exit one.</desc>
