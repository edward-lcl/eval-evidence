<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1020" viewBox="0 0 900 1020" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">FROM RETAINED RUN TO SCOPED CHECK</title>
<desc id="figure-desc">A single left-to-right pipeline has four numbered stages: retained run, normalize evidence, canonical bundle, and scoped check. The last stage emits a scoped JSON result. A small boundary note says the current release records and checks evidence but does not run evaluations, compare models, or establish truth.</desc>
