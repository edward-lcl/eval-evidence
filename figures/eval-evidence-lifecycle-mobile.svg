<text x="76" y="1154" fill="#F8FAFC" font-family="Arial" font-size="22" font-weight="500" text-anchor="start">recorded conditions align</text>
<rect x="460" y="1068" width="388" height="140" rx="24" fill="#111827" stroke="#FF9F43" stroke-width="3"/>
<text x="484" y="1111" fill="#FF9F43" font-family="Arial" font-size="27" font-weight="800" text-anchor="start">DIFFERENT</text>
