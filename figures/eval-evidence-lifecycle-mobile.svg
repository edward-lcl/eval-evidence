<text x="132" y="390" text-anchor="start" fill="#39D0C3" font-family="Arial" font-size="27" font-weight="800">NORMALIZE EVIDENCE</text>
<text x="82" y="431" text-anchor="start" fill="#F8FAFC" font-family="Arial" font-size="23" font-weight="500">adapter maps values + provenance</text>
