<text x="132" y="234" text-anchor="start" fill="#FF7A59" font-family="Arial" font-size="27" font-weight="800">RETAINED RUN</text>
<text x="82" y="275" text-anchor="start" fill="#F8FAFC" font-family="Arial" font-size="23" font-weight="500">result + config + trace files</text>
