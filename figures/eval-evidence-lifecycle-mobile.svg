<text x="82" y="454" fill="#39D0C3" font-family="Arial" font-size="32" font-weight="800" text-anchor="start">2</text>
<text x="135" y="454" fill="#F8FAFC" font-family="Arial" font-size="37" font-weight="800" text-anchor="start">Seal &amp; verify</text>
<text x="82" y="502" fill="#A9B4C5" font-family="Arial" font-size="28" font-weight="500" text-anchor="start">Bind model, harness, budgets,</text>
<text x="82" y="536" fill="#A9B4C5" font-family="Arial" font-size="28" font-weight="500" text-anchor="start">verifier, artifacts, and</text>
<text x="82" y="570" fill="#A9B4C5" font-family="Arial" font-size="28" font-weight="500" text-anchor="start">field provenance</text>
<path d="M450 585 L450 622" stroke="#39D0C3" stroke-width="5" fill="none"/>
<text x="450" y="616" fill="#39D0C3" font-family="Arial" font-size="28" font-weight="800" text-anchor="middle">▼</text>
<rect x="52" y="630" width="796" height="180" rx="24" fill="#111827" stroke="#F7D73A" stroke-width="3"/>
<text x="82" y="679" fill="#F7D73A" font-family="Arial" font-size="32" font-weight="800" text-anchor="start">3</text>
<text x="135" y="679" fill="#F8FAFC" font-family="Arial" font-size="37" font-weight="800" text-anchor="start">Compare or report</text>
<text x="82" y="727" fill="#A9B4C5" font-family="Arial" font-size="28" font-weight="500" text-anchor="start">Show what aligns, differs, or</text>
<text x="82" y="761" fill="#A9B4C5" font-family="Arial" font-size="28" font-weight="500" text-anchor="start">remains unavailable</text>
