<text x="50" y="54" text-anchor="start" fill="#F8FAFC" font-family="Arial" font-size="31" font-weight="800">FROM RETAINED RUN TO SCOPED CHECK</text>
<text x="50" y="104" text-anchor="start" fill="#A7B0C0" font-family="Arial" font-size="21" font-weight="500">It reads retained artifacts, builds a deterministic</text>
<text x="50" y="132" text-anchor="start" fill="#A7B0C0" font-family="Arial" font-size="21" font-weight="500">evidence bundle, and returns scoped integrity results.</text>
<rect x="50" y="184" width="800" height="128" rx="22" fill="#111827" stroke="#FF7A59" stroke-width="3"/>
