<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">A score should never travel alone.</title>
<desc id="figure-desc">A left-to-right post-run lifecycle starts with a reported score, binds recorded model, harness, budget, verifier, artifact, and field-provenance evidence, and then reports one of four explicit review states. A boundary note states that Eval Evidence does not run evaluations, establish physical truth, or issue a universal score.</desc>
<rect width="900" height="1600" fill="#090E16"/>
<text x="52" y="55" fill="#F8FAFC" font-family="Arial" font-size="32" font-weight="800" text-anchor="start">A score should never travel alone.</text>
<text x="52" y="132" fill="#A9B4C5" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">Eval Evidence binds a reported score to retained evidence so</text>
<text x="52" y="161" fill="#A9B4C5" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">review can distinguish aligned conditions, differences,</text>
<rect x="52" y="180" width="796" height="180" rx="24" fill="#111827" stroke="#FF7A59" stroke-width="3"/>
<text x="82" y="229" fill="#FF7A59" font-family="Arial" font-size="32" font-weight="800" text-anchor="start">1</text>
<text x="135" y="229" fill="#F8FAFC" font-family="Arial" font-size="37" font-weight="800" text-anchor="start">Reported score</text>
<text x="82" y="277" fill="#A9B4C5" font-family="Arial" font-size="28" font-weight="500" text-anchor="start">Result enters with declared or</text>
<text x="82" y="311" fill="#A9B4C5" font-family="Arial" font-size="28" font-weight="500" text-anchor="start">captured evidence</text>
<path d="M450 360 L450 397" stroke="#FF7A59" stroke-width="5" fill="none"/>
<text x="450" y="391" fill="#FF7A59" font-family="Arial" font-size="28" font-weight="800" text-anchor="middle">▼</text>
