<title id="t">What released artifacts showed</title>
<desc id="d">Four findings. 1: 142 of 142 Terminal-Bench 2.0 leaderboard scores re-derive. 2: 72 of 142 rows do not count the nominal 445 trials; retry history is not recorded. 3: 95 of 96 random-cohort papers were source-reviewed; coverage, not reproduction. 4: our claim-level audit found 15 and a plain checklist 16 of 18 issues; no detection advantage. In the cases examined, numbers re-derived while the evidence for what they mean often could not be checked. AI review, not human expert validation.</desc>
