<title id="t">One zero, three readings</title>
<desc id="d">A task no agent ever passed shows 0 passes, all the leaderboard can show. Three readings: 1, a real limit, if task and grader are verified the zero is about the agents; 2, a broken measurement, a faulty reference or grader means the zero says nothing about ability; 3, the record cannot tell, a gap rather than an error, kept as unavailable. Current boundary: Eval Evidence records the evidence for each reading and does not decide which one is true.</desc>
