<title id="figure-title">FOUR COMMANDS, ONE EVIDENCE PATH</title>
<desc id="figure-desc">Four rows form a command switchboard. Demo materializes deterministic example files. Check detects, validates, and re-hashes references in memory. Bundle validates and writes canonical evidence JSON. Verify with run root validates the bundle and re-hashes retained source bytes. Each row names its output and a fact the command does not prove.</desc>
