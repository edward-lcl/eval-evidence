<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="figure-title figure-desc">
<title id="figure-title">CHECK IS SIX SMALL TESTS — NOT ONE MAGIC VERDICT</title>
<desc id="figure-desc">Six numbered cards run left to right in two rows. The first three find the run, read its files, and label each field. The next three test the record, re-hash local files, and name the result. The final report branches to Pass or Fail plus reason. A bottom proof boundary says what was checked now and what remains unproven.</desc>
<rect width="900" height="1600" fill="#090E16"/>
<text x="52" y="55" fill="#F8FAFC" font-family="Arial" font-size="32" font-weight="800" text-anchor="start">CHECK IS SIX SMALL TESTS — NOT ONE</text>
<text x="52" y="94" fill="#F8FAFC" font-family="Arial" font-size="32" font-weight="800" text-anchor="start">MAGIC VERDICT</text>
<text x="52" y="132" fill="#A9B4C5" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">Check turns a run directory into six inspectable operations</text>
<text x="52" y="161" fill="#A9B4C5" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">and reports exactly which scoped test passed or failed.</text>
<rect x="52" y="185" width="796" height="108" rx="24" fill="#111827" stroke="#39D0C3" stroke-width="3"/>
<text x="77" y="224" fill="#F8FAFC" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">1  FIND THE RUN</text>
<text x="77" y="264" fill="#A9B4C5" font-family="Arial" font-size="22" font-weight="500" text-anchor="start">detect Generic or Harbor</text>
<rect x="52" y="312" width="796" height="108" rx="24" fill="#111827" stroke="#39D0C3" stroke-width="3"/>
<text x="77" y="351" fill="#F8FAFC" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">2  READ THE FILES</text>
<text x="77" y="391" fill="#A9B4C5" font-family="Arial" font-size="22" font-weight="500" text-anchor="start">parse required JSON</text>
<rect x="52" y="439" width="796" height="108" rx="24" fill="#111827" stroke="#39D0C3" stroke-width="3"/>
<text x="77" y="478" fill="#F8FAFC" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">3  LABEL EACH FIELD</text>
<text x="77" y="518" fill="#A9B4C5" font-family="Arial" font-size="22" font-weight="500" text-anchor="start">observed · asserted · derived · unavailable</text>
<rect x="52" y="566" width="796" height="108" rx="24" fill="#111827" stroke="#39D0C3" stroke-width="3"/>
<text x="77" y="605" fill="#F8FAFC" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">4  TEST THE RECORD</text>
<text x="77" y="645" fill="#A9B4C5" font-family="Arial" font-size="22" font-weight="500" text-anchor="start">schema + embedded digest</text>
<rect x="52" y="693" width="796" height="108" rx="24" fill="#111827" stroke="#39D0C3" stroke-width="3"/>
<text x="77" y="732" fill="#F8FAFC" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">5  RE-HASH LOCAL FILES</text>
<text x="77" y="772" fill="#A9B4C5" font-family="Arial" font-size="22" font-weight="500" text-anchor="start">presence + bytes + SHA-256</text>
<rect x="52" y="820" width="796" height="108" rx="24" fill="#111827" stroke="#39D0C3" stroke-width="3"/>
<text x="77" y="859" fill="#F8FAFC" font-family="Arial" font-size="25" font-weight="800" text-anchor="start">6  NAME THE RESULT</text>
<text x="77" y="899" fill="#A9B4C5" font-family="Arial" font-size="22" font-weight="500" text-anchor="start">coverage + errors + warnings</text>
<rect x="52" y="980" width="388" height="150" rx="24" fill="#111827" stroke="#20D66B" stroke-width="3"/>
<text x="82" y="1035" fill="#20D66B" font-family="Arial" font-size="33" font-weight="800" text-anchor="start">PASS</text>
<text x="82" y="1085" fill="#F8FAFC" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">all requested tests passed</text>
<rect x="460" y="980" width="388" height="150" rx="24" fill="#111827" stroke="#FF5C5C" stroke-width="3"/>
<text x="490" y="1035" fill="#FF5C5C" font-family="Arial" font-size="31" font-weight="800" text-anchor="start">FAIL + REASON</text>
<text x="490" y="1085" fill="#F8FAFC" font-family="Arial" font-size="24" font-weight="500" text-anchor="start">the failing gate is named</text>
<rect x="52" y="1175" width="796" height="170" rx="24" fill="#111827" stroke="#39D0C3" stroke-width="3"/>
<text x="82" y="1222" fill="#39D0C3" font-family="Arial" font-size="28" font-weight="800" text-anchor="start">CHECKED NOW</text>
<text x="82" y="1263" fill="#F8FAFC" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">• record shape</text>
<text x="460" y="1263" fill="#F8FAFC" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">• bundle digest</text>
<text x="82" y="1305" fill="#F8FAFC" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">• referenced bytes</text>
<text x="460" y="1305" fill="#F8FAFC" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">• requested coverage policy</text>
<rect x="52" y="1375" width="796" height="160" rx="24" fill="#111827" stroke="#F7D73A" stroke-width="3"/>
<text x="82" y="1422" fill="#F7D73A" font-family="Arial" font-size="28" font-weight="800" text-anchor="start">STILL NOT PROVEN</text>
<text x="82" y="1462" fill="#F8FAFC" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">• who ran it</text>
<text x="82" y="1493" fill="#F8FAFC" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">• whether the score is true</text>
<text x="82" y="1524" fill="#F8FAFC" font-family="Arial" font-size="23" font-weight="500" text-anchor="start">• whether two runs are comparable</text>
</svg>
