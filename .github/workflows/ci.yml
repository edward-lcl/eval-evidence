name: CI

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install '.[test]'
      - run: python -m unittest discover -s tests -v

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m build --wheel --sdist --outdir dist
      - run: python scripts/audit_distribution.py dist
      - run: python -m venv /tmp/eval-evidence-venv
      - run: /tmp/eval-evidence-venv/bin/pip install dist/*.whl
      - run: /tmp/eval-evidence-venv/bin/eval-evidence demo -o /tmp/demo
      - run: /tmp/eval-evidence-venv/bin/eval-evidence check /tmp/demo
