name: Eval Evidence Check
description: Check evaluation run structure, evidence coverage, and current referenced bytes
branding:
  icon: shield
  color: blue

inputs:
  run-path:
    description: Repository-relative run or archive directory
    required: true
  adapter:
    description: Adapter to use (auto, generic, or harbor)
    required: false
    default: auto
  max-runs:
    description: Optional positive limit for deterministic archive checks
    required: false
    default: ""
  min-coverage:
    description: Optional minimum available instrument-field fraction (0 through 1)
    required: false
    default: ""
  python-version:
    description: Python version used to run Eval Evidence
    required: false
    default: "3.11"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Eval Evidence
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"
    - name: Check evaluation evidence
      shell: bash
      env:
        EVAL_EVIDENCE_RUN_PATH: ${{ inputs.run-path }}
        EVAL_EVIDENCE_ADAPTER: ${{ inputs.adapter }}
        EVAL_EVIDENCE_MAX_RUNS: ${{ inputs.max-runs }}
        EVAL_EVIDENCE_MIN_COVERAGE: ${{ inputs.min-coverage }}
      run: |
        resolved="$(python - <<'PY'
        import os
        from pathlib import Path
        root = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
        supplied = Path(os.environ["EVAL_EVIDENCE_RUN_PATH"])
        if supplied.is_absolute() or ".." in supplied.parts:
            raise SystemExit("run-path must be repository-relative and cannot contain '..'")
        candidate = (root / supplied).resolve()
        try:
            candidate.relative_to(root)
        except ValueError:
            raise SystemExit("run-path escapes GITHUB_WORKSPACE")
        print(candidate)
        PY
        )"
        args=("$resolved" --adapter "$EVAL_EVIDENCE_ADAPTER")
        if [[ -n "$EVAL_EVIDENCE_MAX_RUNS" ]]; then
          args+=(--max-runs "$EVAL_EVIDENCE_MAX_RUNS")
        fi
        if [[ -n "$EVAL_EVIDENCE_MIN_COVERAGE" ]]; then
          args+=(--min-coverage "$EVAL_EVIDENCE_MIN_COVERAGE")
        fi
        eval-evidence check "${args[@]}"
